name: frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # npm caching turns on automatically once the scaffold (#2) adds
      # frontend/package-lock.json. Until that file exists, setup-node's built-in
      # cache would fail the run (nothing to hash), so we pick the variant by
      # whether the lockfile is present.
      - name: Set up Node (no cache until package-lock.json exists)
        if: hashFiles('frontend/package-lock.json') == ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Node (with npm cache)
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint, typecheck, test & build
        run: |
          if [ ! -d frontend ] || [ ! -f frontend/package.json ]; then
            echo "::notice::frontend not scaffolded yet — skipping (see #2)"; exit 0
          fi
          cd frontend
          npm ci
          npm run lint --if-present
          npx --no-install tsc --noEmit
          # `npm test` is `vitest run` (single-shot, CI-appropriate) — no Jest flags
          npm test --if-present
          npm run build
