name: frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main, planning]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: setup-node's built-in `cache: npm` is intentionally NOT enabled
      # yet — it fails the job until the scaffold (#2) adds frontend/package-lock.json
      # to hash. Re-enable with `cache: npm` + `cache-dependency-path:
      # frontend/package-lock.json` in the scaffold PR.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint, typecheck, test & build
        run: |
          if [ ! -d frontend ] || [ ! -f frontend/package.json ]; then
            echo "::notice::frontend not scaffolded yet — skipping (see #2)"; exit 0
          fi
          cd frontend
          npm ci
          npm run lint --if-present
          npx --no-install tsc --noEmit
          npm test --if-present -- --ci --watchAll=false
          npm run build
