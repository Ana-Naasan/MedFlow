name: Claude Auto Review

# Automated PR code review by Claude. Runs on every opened PR and on new
# commits pushed to an open PR. Posts inline comments + a summary review.
#
# REQUIRES (one-time, repo-admin only — cannot be done from this file):
#   1. Install the Claude GitHub App:  https://github.com/apps/claude
#      (grant Contents R/W, Issues R/W, Pull requests R/W on this repo)
#   2. Add ONE auth secret under Settings → Secrets and variables → Actions:
#        - ANTHROPIC_API_KEY            (pay-per-token API; console.anthropic.com), OR
#        - CLAUDE_CODE_OAUTH_TOKEN      (uses a Claude subscription; run `claude setup-token`)
#      If you use the OAuth token, swap the `anthropic_api_key:` line below for
#      `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}`.
#   3. Settings → Actions → General → enable read/write workflow permissions.
#
# NOTE: this does NOT retro-review PRs opened before it landed. Trigger a review
# on an existing PR by pushing a commit or commenting `@claude review`.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the Umraa polypharmacy decision-packet
            project. Prioritise, in order:
            - Correctness bugs and logic errors, especially in correctness-critical
              code: connector→FHIR mappers, the cache refresh-on-read path, citation
              resolution, knowledge joins, the reasoning verifier.
            - Security & PHI: SEC-02 minimization (no name/address/phone/next-of-kin
              into reasoning; MRN-keyed; age-from-DOB), read-only connectors, no
              secrets committed, synthetic-data-only.
            - The non-negotiable invariant: no resolvable citation → not shown;
              "may be associated — consider reviewing" language, never "caused by".
            - Test coverage on correctness-critical changes (the project gates those
              packages at 100% on Python 3.12).
            - General code quality, error handling, and missing input validation.

            Use inline comments for specific issues and post one top-level summary
            comment with a clear verdict. Be concise; do not nitpick formatting that
            ruff/black/eslint already enforce.
          claude_args: |
            --max-turns 12
            --model claude-opus-4-8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
